# Protocole : SASL par-dessus TLS
security.protocol=SASL_SSL

# TLS (inchangé)
ssl.truststore.location=/home/dthibau/Formations/Kafka/kafka-solutions/ssl/mount/kafka.truststore.jks
ssl.truststore.password=secret
ssl.endpoint.identification.algorithm=

# SASL : mécanisme OAUTHBEARER
sasl.mechanism=OAUTHBEARER

# JAAS : OAuth2 client credentials flow
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="kafka-broker" clientSecret="broker-secret" scope="openid";

# Callback handler : récupère le token via le token endpoint
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler

# Endpoint Keycloak pour obtenir le token
sasl.oauthbearer.token.endpoint.url=http://localhost:9090/realms/kafka/protocol/openid-connect/token