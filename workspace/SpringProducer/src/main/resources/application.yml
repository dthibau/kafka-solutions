async: true
spring:
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: localhost:19092
    ssl:
      trust-store-location: file:///home/dthibau/Formations/Kafka/github/kafka-solutions/ssl/mount/kafka.truststore.jks
      trust-store-password: secret

    security:
      protocol: SSL

    producer:
      bootstrap-servers:
      - localhost:19092
      - localhost:19093
